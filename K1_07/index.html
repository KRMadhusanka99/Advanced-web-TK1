<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Submission</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-container">

    <div class="header">
      <h1>International Conference on Web Technologies 2027</h1>
      <p>
        Welcome! Please submit your paper using the form below. Papers must be
        original work and submitted as a single PDF. Fill in all fields, upload
        your PDF and press <strong>Submit</strong>.
      </p>
    </div>

    <div class="form-container">
      <div id="output"></div>

      <form id="submissionForm" action="confirmation.html" method="post"
            enctype="multipart/form-data" novalidate
            onsubmit="return validation(this)">

        <!-- Paper information -->
        <div class="section">
          <h2>Paper information</h2>
          <div class="field">
            <label for="title">Title</label>
            <input type="text" name="title" id="title">
          </div>
          <div class="field">
            <label for="abstract">Abstract</label>
            <textarea name="abstract" id="abstract" rows="6"></textarea>
          </div>
          <div class="field">
            <label for="keywords">Keywords</label>
            <input type="text" name="keywords" id="keywords"
                   placeholder="comma-separated, e.g. web, css, javascript">
          </div>
        </div>

        <!-- Author information -->
        <div class="section">
          <h2>Authors</h2>
          <div id="authors">
            <div class="author-row">
              <strong class="author-number">Author 1</strong>
              <div class="field">
                <label>Name <input type="text" name="author"></label>
              </div>
              <div class="field">
                <label>Affiliation <input type="text" name="affiliation"></label>
              </div>
              <div class="field">
                <label>Email <input type="email" name="email"></label>
              </div>
              <button type="button" class="remove-author">Remove</button>
            </div>
          </div>
          <button type="button" id="add-author">+ Add author</button>
        </div>

        <!-- PDF selector -->
        <div class="section">
          <h2>Paper file</h2>
          <div class="field">
            <label for="paper">PDF file</label>
            <input type="file" name="paper" id="paper" accept="application/pdf">
          </div>
        </div>

        <!-- Buttons -->
        <div class="section actions">
          <button type="submit" class="primary">Submit</button>
          <button type="reset">Reset</button>
        </div>

      </form>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
